<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookshelf</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Libre+Baskerville&display=swap" rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet" href="css/styles.css">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="logo">Book Search</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="bookshelf.html" class="active">My Bookshelf</a>
  </div>
</nav>

<!-- CONTENT -->
<div class="container">
  <h2 class="page-title">My Bookshelf</h2>

  <div id="booksGrid" class="books-grid"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p>Book Search App — Google Books API</p>
</footer>

<script>
// my API key
const API_KEY = "AIzaSyAKDvKl8cU38lc-1vkK-vmWA7MdAkC3MWE";
//my books
const BOOK_IDS = [
  "-9WUEQAAQBAJ",
  "Vf9JtAEACAAJ",
  "FQaalAEACAAJ",
  "LKdGpOxtEHsC",
  "RehWEQAAQBAJ"
];

$(function () {

  BOOK_IDS.forEach(function (id) {

    const url = `https://www.googleapis.com/books/v1/volumes/${id}`;

    $.getJSON(url)
      .done(function (data) {

        const info = data.volumeInfo || {};
        const title = info.title || "No Title";
        const authors = (info.authors || []).join(", ");
        const cover = info.imageLinks?.thumbnail || "";

        const card = `
          <a class="book-card" href="details.html?id=${id}">
            <div class="cover-wrap">
              ${cover 
                ? `<img src="${cover}" alt="${title}">` 
                : `<span class="no-cover">No Cover</span>`}
            </div>
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-author">${authors}</div>
            </div>
          </a>
        `;

        $("#booksGrid").append(card);
      })

      .fail(function () {
        console.log("Error loading book:", id);
      });

  });

});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>My Bookshelf</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<nav>
  <h2>Library</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="bookshelf.html">My Bookshelf</a>
  </div>
</nav>

<div id="bookshelf" class="grid"></div>

<script>
$(document).ready(function(){
  const bookIds = [
    "zyTCAlFPjgYC",
    "m8dPPgAACAAJ",
    "uW3bDwAAQBAJ"
  ];

  bookIds.forEach(id => {
    $.getJSON(`https://www.googleapis.com/books/v1/volumes/${id}`, function(book) {
      const info = book.volumeInfo;

      const html = `
        <div class="book">
          <img src="${info.imageLinks?.thumbnail || ""}">
          <h3><a href="details.html?id=${book.id}">${info.title}</a></h3>
        </div>
      `;

      $("#bookshelf").append(html);
    });
  });
});
</script>
</body>
</html>

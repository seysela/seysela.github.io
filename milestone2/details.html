<!DOCTYPE html>
<html>
<head>
  <title>Book Details</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<nav>
  <h2>Library</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="bookshelf.html">My Bookshelf</a>
  </div>
</nav>

<div id="bookDetails" class="details"></div>

<script>
$(document).ready(function(){
  const params = new URLSearchParams(window.location.search);
  const bookId = params.get("id");

  $.getJSON(`https://www.googleapis.com/books/v1/volumes/${bookId}`, function(book) {
    const info = book.volumeInfo;
    const sale = book.saleInfo;

    const html = `
      <h1>${info.title}</h1>
      <img src="${info.imageLinks?.thumbnail || ""}">
      <p><b>Authors:</b> ${info.authors?.join(", ") || "N/A"}</p>
      <p><b>Publisher:</b> ${info.publisher || "N/A"}</p>
      <p>${info.description || "No description"}</p>
      <p><b>Price:</b> ${sale?.listPrice?.amount || "Not for sale"}</p>
    `;

    $("#bookDetails").html(html);
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Search – Milestone 2</title>

  <!-- google fonts for better typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- jQuery library -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    /* CSS colors/ blush colour palette. i put all the colors here so if i change one, it updates everywhere */
    :root {
      --bg:        #fdf6f9;   
      --surface:   #ffffff;   
      --nav-bg:    #3d2645;   /* deep plum for navbar/footer */
      --primary:   #c084a0;   /* rose for buttons, active links */
      --primary-dk:#a8667f;   /* darker rose for hover color */
      --accent:    #e8c4d4;   
      --lilac:     #d8b4d8;   /* soft lilac for the tags */
      --lilac-bg:  #f3eaf6;   
      --border:    #edd8e8;   
      --text:      #2e1a2e;   /* dark purple text*/
      --muted:     #9c7a90;   /* for text that is less prominent*/
      --radius:    15px;
      --shadow:    0 4px 20px rgba(192,132,160,.12);
    }

    /* makes the elements consistent */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* nav  bar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--nav-bg);
      position: sticky; /* sticks to top when the user scrolls down so nav stays visible */
      top: 0;
      z-index: 100;
    }

    /* title of site */
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #f0d8e8;
      text-decoration: none;
      letter-spacing: .5px;
    }

    .nav-links { 
      display: flex; 
      gap: 1.4rem; 
    }

    .nav-links a {
      color: #c8aac0;
      text-decoration: none;
      font-weight: 600;
      font-size: .98rem;
      padding: .35rem .75rem;
      border-radius: 6px;
      transition: color .2s, background .2s; /* hover effect */
    }

    /* highlights current nav link */
    .nav-links a:hover,
    .nav-links a.active {
      color: #f8e4f0;
      background: rgba(216,180,216,.18);
    }

    /* hero section under nav bar */
    .hero {
      background: linear-gradient(135deg, var(--nav-bg) 0%, #5c3460 100%);
      color: #fff;
      padding: 4rem 2rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 5vw, 3.6rem); /* responsive: min 2rem, max 3rem */
      line-height: 1.2;
      margin-bottom: .6rem;
      color: #f8e8f4;
    }

    .hero p {
      color: #c8a8c4;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    /* search bar */
    .search-bar {
      display: flex;
      max-width: 700px;
      margin: 0 auto;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 4px 28px rgba(0,0,0,.3);
    }

    .search-bar input {
      flex: 1; 
      border: none;
      padding: .95rem 1.4rem;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .search-bar button {
      background: var(--primary);
      border: none;
      padding: .98rem 1.8rem;
      font-size: .98rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      color: #fff;
      cursor: pointer;
      transition: background .2s;
    }

    .search-bar button:hover { 
      background: var(--primary-dk); 
    }

    /* main container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    /* results header */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .8rem;
      margin-bottom: 1.5rem;
      font-size: .98rem;
      color: var(--muted);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .pagination-controls select {
      padding: .4rem .7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-size: .87rem;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    /* books grid */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 1.5rem;
    }

    /* book card */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .25s, box-shadow .25s;
      display: flex;
      flex-direction: column;
      text-decoration: none;    /* removes the underline from title and author*/
      color: inherit;           /* makes sure the title or author dont show as default blue links */
    }

    /* lifts the card a little on hover */
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(192,132,160,.22);
    }

    /* keeps cards uniform in height */
    .book-card .cover-wrap {
      background: var(--lilac-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 210px;
      overflow: hidden;
    }

    .book-card .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .3s;
    }

    /* zooms in on cover image when hovering */
    .book-card:hover .cover-wrap img { 
      transform: scale(1.04); 
    }

    /* placeholder for books without covers */
    .no-cover {
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .book-card .card-body {
      padding: .85rem 1rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .book-card .card-title {
      font-weight: 800;
      font-size: .90rem;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      /* long titles are limited to 2 lines then ... is shown */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-card .card-title:hover { 
      color: var(--primary); 
    }

    .book-card .card-author {
      font-size: .80rem;
      color: var(--primary-dk);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* spinner for loading state */
    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary); 
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* for error handling */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      font-size: 1rem;
      color: var(--muted);
    }

    /* hides elements that dont need to be shown */
    .hidden { display: none !important; }

    /* footer */
    .footer {
      text-align: center;
      padding: 1.5rem;
      background: var(--nav-bg);
      color: #9a7898;
      font-size: .85rem;
      margin-top: auto;
    }
  </style>
</head>

<body>

  <!-- navigation bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">Milestone 2 — Google Books Search</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="bookshelf.html">My Bookshelf</a>
    </div>
  </nav>

  <!-- hero section -->
  <header class="hero">
    <h1>Search for Books</h1>
    <p>Supported by the Google Books API</p>

    <div class="search-bar">
      <!-- searchInput is targeted by jQuery -->
      <input type="text" id="searchInput" placeholder="Enter a title, author, or keyword..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- results start hidden and are revealed by JavaScript after a search runs -->
  <main class="container">

    <!-- result count and page selector are hidden until a search completes -->
    <div id="resultsHeader" class="results-header hidden">
      <span id="resultsCount"></span>
      <div class="pagination-controls">
        <label for="pageSelect">Page:</label>
        <select id="pageSelect"></select>
      </div>
    </div>

    <!-- spinner while API is loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Searching for books...</p>
    </div>

    <!-- message shown if API returns zero results -->
    <div id="noResults" class="no-results hidden">
      <p>No books were found. Try a different search term.</p>
    </div>

    <!-- book cards inserted into the grid by JS -->
    <div id="booksGrid" class="books-grid"></div>

  </main>

  <!-- footer -->
  <footer class="footer">
    <p>Milestone 2 — Book Search App &mdash; Google Books API</p>
  </footer>

<script>

  // my google books API key
  const API_KEY = "AIzaSyBOJ9CK-iThAPfb4GZIQ-x9sYsxmhJnCEY";

  // each page shows 20 results
  const PER_PAGE = 20;

  // 3 pages in total gives max of 60 results
  const TOTAL_PAGES = 3;

  // stores the current search query so page changes can re-use it
  let currentQuery = "";

  /* waits for the document to be ready before executing */
  $(function () {

    // enter keypress in search box triggers search
    $("#searchInput").on("keypress", function (e) {
      if (e.key === "Enter") doSearch(1);
    });

    // search button click
    $("#searchBtn").on("click", function () {
      doSearch(1);
    });

    // fresh API call when page dropdown changes, using the selected page number
    $("#pageSelect").on("change", function () {
      const page = parseInt($(this).val());
      doSearch(page);
    });

  });

  /* doSearch(page) makes a fresh API call each time, using
     startIndex to get the correct page for the requested results */
  function doSearch(page) {
    const query = page === 1
      ? $("#searchInput").val().trim()
      : currentQuery;

    //if search is empty, nothing happens
    if (!query) return;

    // saves the query so page changes re-use it
    currentQuery = query;

    // resets UI
    $("#booksGrid").empty();
    $("#noResults").addClass("hidden");
    $("#loading").removeClass("hidden");

    // calculates the startIndex for the API call based on the requested page number
    // page 1 startIndex = 0, page 2 startIndex = 20, page 3 startIndex = 40, total is 60
    const startIndex = (page - 1) * PER_PAGE;

    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&startIndex=${startIndex}&maxResults=${PER_PAGE}&key=${API_KEY}`;

    $.getJSON(url)
      .done(function (data) {
        const books = data.items || [];

        $("#loading").addClass("hidden");

        if (books.length === 0) {
          $("#noResults").removeClass("hidden");
          $("#resultsHeader").addClass("hidden");
          return;
        }

        // builds the page dropdown on first search only
        if (page === 1) {
          buildPageDropdown();
        }

        // syncs the dropdown to the current page
        $("#pageSelect").val(page);
        $("#resultsHeader").removeClass("hidden");
        const rangeStart = (page - 1) * PER_PAGE + 1;
        const rangeEnd = (page - 1) * PER_PAGE + books.length;
        $("#resultsCount").text(`Showing ${rangeStart}–${rangeEnd} of ${TOTAL_PAGES * PER_PAGE} results for "${query}"`);
       
        // renders the books
        books.forEach(function (book) {
          const info    = book.volumeInfo || {};
          const title   = info.title || "Unknown Title";
          const authors = (info.authors || ["Unknown Author"]).join(", ");

          const cover = info.imageLinks
            ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)
            : null;

          const imgHtml = cover
            ? `<img src="${cover}" alt="${title}" loading="lazy" />`
            : `<span class="no-cover">No Cover</span>`;

          const card = `
            <a class="book-card" href="details.html?id=${book.id}">
              <div class="cover-wrap">${imgHtml}</div>
              <div class="card-body">
                <span class="card-title">${title}</span>
                <span class="card-author">${authors}</span>
              </div>
            </a>`;

          $("#booksGrid").append(card);
        });

        // Staggered fade in
        $(".book-card").hide().each(function (i) {
          $(this).delay(i * 50).fadeIn(300);
        });

      })
      .fail(function () {
        $("#loading").addClass("hidden");
        $("#noResults").removeClass("hidden")
          .find("p").text("API error. Please try again later.");
      });
  }

  /* buildPageDropdown creates a fixed 3 page dropdown */
  function buildPageDropdown() {
    const $select = $("#pageSelect").empty();
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      $select.append(`<option value="${i}">${i} of ${TOTAL_PAGES}</option>`);
    }
  }
</script>

</body>
</html>

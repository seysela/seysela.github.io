<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Single Book Display</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}
.container {
    max-width: 800px;
    margin: auto;
}
img {
    float: left;
    margin-right: 20px;
    width: 150px;
}
h1 {
    color: #2c3e50;
}
.clear {
    clear: both;
}
</style>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
<div class="container">
    <h1>Single Book Information</h1>
    <div id="book"></div>
</div>

<script>
$(document).ready(function() {
    $.getJSON("google-books-book.json", function(data) {

        var book = data.volumeInfo;

        var title = book.title;
        var authors = book.authors ? book.authors.join(", ") : "N/A";
        var publisher = book.publisher ? book.publisher : "N/A";
        var publishedDate = book.publishedDate ? book.publishedDate : "N/A";
        var description = book.description ? book.description : "No description available.";
        var image = book.imageLinks ? book.imageLinks.thumbnail : "";
        var preview = book.previewLink ? book.previewLink : "#";

        var html = "";
        if (image !== "") {
            html += "<img src='" + image + "' alt='Book cover'>";
        }
        html += "<h2>" + title + "</h2>";
        html += "<p><strong>Authors:</strong> " + authors + "</p>";
        html += "<p><strong>Publisher:</strong> " + publisher + "</p>";
        html += "<p><strong>Published Date:</strong> " + publishedDate + "</p>";
        html += "<p><strong>Description:</strong> " + description + "</p>";
        html += "<p><a href='" + preview + "' target='_blank'>Preview this book</a></p>";
        html += "<div class='clear'></div>";

        $("#book").html(html);
    })
    .fail(function() {
        $("#book").html("<p>Error loading book data.</p>");
    });
});
</script>

</body>
</html>
